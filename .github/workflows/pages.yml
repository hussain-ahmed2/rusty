name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: pages
        uses: actions/configure-pages@v5
      - name: Export static site
        run: cargo run --release -p site
        env:
          RUSTY_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_OUT_DIR: .pages
      - name: Check export
        run: |
          test -f .pages/index.html
          test -f .pages/404.html
          test -f .pages/docs.html
          test -f .pages/docs/index.html
          test -f .pages/docs/getting-started.html
          test -f .pages/sitemap.xml
          test -f .pages/robots.txt
          test -f .pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed routes
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${BASE_URL%/}"
          for path in / /docs /docs/getting-started /about; do
            url="$base$path"
            status=000
            redirect=""
            for attempt in $(seq 1 24); do
              response=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$url" || true)
              status=${response%% *}
              redirect=${response#* }
              if [ -z "$response" ]; then
                status=000
                redirect=""
              elif [ "$redirect" = "$response" ]; then
                redirect=""
              fi
              if [ "$status" = 200 ] && [ -z "$redirect" ]; then
                break
              fi
              sleep 5
            done
            if [ "$status" != 200 ] || [ -n "$redirect" ]; then
              echo "$url returned $status${redirect:+ redirecting to $redirect}" >&2
              exit 1
            fi
            echo "$url -> $status"
          done
